<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-box">
        <h2 class="mb-3 text-center">Budget Tracker</h2>

        <input id="payCheck" type="number" placeholder="Paycheck amount">

        <input id="rent" type="number" placeholder="Rent">
        <input type="number" id="utilities" placeholder="Utilities (electric, water, etc.)">
        <input id="groceries" type="number" placeholder="Groceries">
        <input id="gas" type="number" placeholder="Gas">
        <input id="carPayment" type="number" placeholder="Car payment">
        <input id="phoneBill" type="number" placeholder="Phone bill">
        <input type="number" id="other" placeholder="Other expenses">


        <p>Pay frequency:</p>
        <div class="radio-group">
    <label>
        <input type="radio" name="payFreq" id="weekly">
        <span>Weekly</span>
    </label>
    <label>
        <input type="radio" name="payFreq" id="biWeekly">
        <span>Bi-weekly</span>
    </label>
    <label>
        <input type="radio" name="payFreq" id="monthly">
        <span>Monthly</span>
    </label>
</div>


        <button onclick="calculateBudget()">Calculate</button>

        <!-- Results card -->
        <div id="resultsCard" class="results-card d-none mt-3">
            <h5 class="mb-2">Monthly Budget Summary</h5>

            <div class="result-row">
                <span>Total income (per month)</span>
                <span id="resultIncome">$0.00</span>
            </div>
            <div class="result-row">
                <span>Total bills</span>
                <span id="resultBills">$0.00</span>
            </div>
            <div class="result-row">
                <span>Savings set aside (10%)</span>
                <span id="resultSavings">$0.00</span>
            </div>
            <div class="result-row">
                <span>Total expenses (bills + savings)</span>
                <span id="resultTotalExpenses">$0.00</span>
            </div>
            <div class="result-row result-highlight">
                <span>Daily spending money</span>
                <span id="resultDailyBudget">$0.00</span>
            </div>

            <div class="mt-2">
                <small class="text-muted">Expenses vs income</small>
                <div class="progress mt-1">
                    <div
                        id="expenseProgress"
                        class="progress-bar"
                        role="progressbar"
                        style="width: 0%"
                        aria-valuenow="0"
                        aria-valuemin="0"
                        aria-valuemax="100"
                    ></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
